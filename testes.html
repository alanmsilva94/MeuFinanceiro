<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Testes – MeuFinanceiro</title>
  <link rel="stylesheet" href="css/fontes.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <style>
    body { padding: 24px; max-width: 900px; margin: 0 auto; }
    h1 { margin-bottom: 8px; }
    .resumo { margin: 16px 0; }
    .ok { color: var(--cor-receita); }
    .falha { color: var(--cor-despesa); font-weight: 600; }
    td code { font-size: 12px; }
  </style>
</head>
<body>
  <h1>Testes automáticos</h1>
  <p class="texto-secundario">Abra este arquivo no navegador para conferir as funções do núcleo. Nenhum dado é lido ou gravado.</p>
  <div class="resumo painel" id="resumo"></div>
  <div class="painel tabela-rolagem"><table class="tabela" id="resultados"><thead><tr><th>Teste</th><th>Resultado</th></tr></thead><tbody></tbody></table></div>

  <script src="js/nucleo/app.js"></script>
  <script src="js/nucleo/util.js"></script>
  <script src="js/nucleo/xlsx.js"></script>
  <script src="js/calculo/motor.js"></script>
  <script src="js/calculo/recorrencias.js"></script>
  <script src="js/calculo/cartoes.js"></script>
  <script src="js/calculo/investimentos.js"></script>
  <script src="js/calculo/painel.js"></script>
  <script src="js/dados/comum.js"></script>
  <script src="js/nucleo/backup.js"></script>
  <script src="js/dados/contas.js"></script>
  <script src="js/dados/categorias.js"></script>
  <script src="js/dados/lancamentos.js"></script>
  <script src="js/dados/recorrencias.js"></script>
  <script src="js/dados/cartoes.js"></script>
  <script src="js/dados/faturas.js"></script>
  <script src="js/dados/compras.js"></script>
  <script src="js/dados/investimentos.js"></script>
  <script src="js/dados/exportacao.js"></script>
  <script>
    // Se um teste quebrar de vez (erro de programação, não falha de conferência), mostra o erro aqui.
    function mostrarErroDosTestes(motivo) {
      document.getElementById('resumo').innerHTML =
        '<span class="falha">Os testes pararam por um erro: </span><code>' + App.util.escaparHtml(String((motivo && motivo.stack) || motivo)) + '</code>';
    }
    window.addEventListener('unhandledrejection', function (e) { mostrarErroDosTestes(e.reason); });
    window.addEventListener('error', function (e) { mostrarErroDosTestes(e.error || e.message); });

    (async function () {
      const U = App.util;
      const resultados = [];

      // Lança erro de validação esperado e confere um trecho da mensagem.
      async function erro(nome, funcao, trecho) {
        try {
          await funcao();
          resultados.push({ nome, ok: false, detalhe: 'deveria ter recusado' });
        } catch (e) {
          const ok = e instanceof App.ErroValidacao && e.message.includes(trecho);
          resultados.push({ nome, ok, detalhe: ok ? '' : 'mensagem recebida: ' + e.message });
        }
      }

      // Armazenamento falso, só em memória: nada é lido nem gravado em disco.
      const memoria = {};
      let gravacoes = [];
      App.storage = {
        obter: function (n) { return memoria[n]; },
        salvar: async function (n) { gravacoes.push(n); },
      };
      function zerarDados() {
        ['config', 'contas', 'categorias', 'lancamentos', 'recorrencias', 'cartoes', 'compras_cartao', 'faturas', 'investimentos']
          .forEach(function (n) { memoria[n] = { versao: 1, registros: [] }; });
        gravacoes = [];
      }
      zerarDados();

      function igual(nome, obtido, esperado) {
        const ok = JSON.stringify(obtido) === JSON.stringify(esperado);
        resultados.push({ nome, ok, detalhe: ok ? '' : 'obtido ' + JSON.stringify(obtido) + ', esperado ' + JSON.stringify(esperado) });
      }

      // Dinheiro
      igual('paraCentavos: "1.234,56"', U.paraCentavos('1.234,56'), 123456);
      igual('paraCentavos: "1234,5"', U.paraCentavos('1234,5'), 123450);
      igual('paraCentavos: "R$ 1.200"', U.paraCentavos('R$ 1.200'), 120000);
      igual('paraCentavos: "0,01"', U.paraCentavos('0,01'), 1);
      igual('paraCentavos: "-10,00"', U.paraCentavos('-10,00'), -1000);
      igual('paraCentavos: "1.23,45" é inválido', U.paraCentavos('1.23,45'), null);
      igual('paraCentavos: "12,345" é inválido', U.paraCentavos('12,345'), null);
      igual('paraCentavos: "abc" é inválido', U.paraCentavos('abc'), null);
      igual('paraCentavos: vazio é inválido', U.paraCentavos(''), null);
      igual('paraCentavos: número não é aceito', U.paraCentavos(10), null);
      igual('formatarMoeda: 123456', U.formatarMoeda(123456).replace(/\s/g, ' '), 'R$ 1.234,56');
      igual('formatarMoeda: valor não inteiro', U.formatarMoeda(10.5), '—');
      igual('centavosParaCampo: 1234567', U.centavosParaCampo(1234567), '12.345,67');
      igual('centavosParaCampo: -5', U.centavosParaCampo(-5), '-0,05');
      igual('ida e volta: 0,1 + 0,2 sem erro de arredondamento', U.paraCentavos('0,10') + U.paraCentavos('0,20'), 30);

      // Datas
      igual('ehDataISO: 2026-02-29 não existe', U.ehDataISO('2026-02-29'), false);
      igual('ehDataISO: 2028-02-29 existe', U.ehDataISO('2028-02-29'), true);
      igual('ehDataISO: 2026-13-01 é inválida', U.ehDataISO('2026-13-01'), false);
      igual('formatarData', U.formatarData('2026-11-10'), '10/11/2026');
      igual('somarMeses: virada de ano para frente', U.somarMeses('2026-12', 1), '2027-01');
      igual('somarMeses: virada de ano para trás', U.somarMeses('2027-01', -1), '2026-12');
      igual('somarMeses: 24 meses', U.somarMeses('2026-11', 24), '2028-11');
      igual('ultimoDiaDoMes: fevereiro de 2026', U.ultimoDiaDoMes(2026, 2), 28);
      igual('nomeMes', U.nomeMes('2026-11'), 'Novembro de 2026');
      igual('ehMesISO: 2026-00 é inválido', U.ehMesISO('2026-00'), false);

      // IDs e texto
      igual('gerarId: prefixo e tamanho', /^lan_[0-9a-f]{12}$/.test(U.gerarId('lan')), true);
      igual('gerarId: dois IDs diferentes', U.gerarId('x') !== U.gerarId('x'), true);
      igual('escaparHtml', U.escaparHtml('<b>"A&B"</b>'), '&lt;b&gt;&quot;A&amp;B&quot;&lt;/b&gt;');

      // ---------- Motor de cálculo: saldos (RF-02, RF-03, regras 6.1 e 6.2) ----------
      const C = App.calc;
      const contasT = [
        { id: 'a', saldoInicial: 100000, ativa: true },
        { id: 'b', saldoInicial: 0, ativa: true },
        { id: 'c', saldoInicial: 5000, ativa: false },
      ];
      const lan = (tipo, valor, contaId, extra) => Object.assign(
        { tipo, valor, contaId, contaDestinoId: null, situacao: tipo === 'receita' || tipo === 'resgate' ? 'recebido' : 'pago' }, extra || {});
      igual('saldo: sem lançamentos é o saldo inicial', C.saldos(contasT, [])['a'], 100000);
      igual('saldo: receita recebida soma', C.saldos(contasT, [lan('receita', 25000, 'a')])['a'], 125000);
      igual('saldo: despesa paga subtrai', C.saldos(contasT, [lan('despesa', 30000, 'a')])['a'], 70000);
      igual('saldo: pendente não altera o saldo', C.saldos(contasT, [lan('despesa', 30000, 'a', { situacao: 'pendente' })])['a'], 100000);
      igual('saldo: transferência sai de uma conta', C.saldos(contasT, [lan('transferencia', 40000, 'a', { contaDestinoId: 'b' })])['a'], 60000);
      igual('saldo: transferência entra na outra', C.saldos(contasT, [lan('transferencia', 40000, 'a', { contaDestinoId: 'b' })])['b'], 40000);
      igual('saldo: transferência não muda o total', (function () {
        const s = C.saldos(contasT, [lan('transferencia', 40000, 'a', { contaDestinoId: 'b' })]);
        return s.a + s.b;
      })(), 100000);
      igual('saldo: aporte sai da conta', C.saldos(contasT, [lan('aporte', 10000, 'a')])['a'], 90000);
      igual('saldo: resgate entra na conta', C.saldos(contasT, [lan('resgate', 10000, 'a')])['a'], 110000);
      igual('saldo: pagamento de fatura sai da conta', C.saldos(contasT, [lan('pagamento_fatura', 20000, 'a')])['a'], 80000);
      igual('saldo: taxa de investimento sai da conta', C.saldos(contasT, [lan('taxa_investimento', 500, 'a')])['a'], 99500);
      igual('saldo: saldo inicial negativo', C.saldos([{ id: 'x', saldoInicial: -5000 }], [lan('receita', 2000, 'x')])['x'], -3000);
      igual('saldo: lançamento de conta desconhecida é ignorado', C.saldos(contasT, [lan('receita', 999, 'zzz')])['a'], 100000);
      igual('saldoTotal: soma todas as contas, inclusive as inativas (o dinheiro nelas continua existindo)', C.saldoTotal(contasT, C.saldos(contasT, [])), 105000);

      // ---------- Contas (RF-01 a RF-04) ----------
      const base = { nome: 'Nubank Conta', instituicao: 'Nubank', tipo: 'corrente', saldoInicial: 250000, dataAbertura: '2026-01-01' };
      igual('contas: criar grava só contas.json', (await App.contas.criar(base), gravacoes), ['contas']);
      igual('contas: conta criada nasce ativa com id acc_', (function () {
        const c = App.contas.listar()[0];
        return c.ativa === true && /^acc_[0-9a-f]{12}$/.test(c.id) && !!c.criadoEm;
      })(), true);
      await erro('contas: nome em branco', () => App.contas.criar(Object.assign({}, base, { nome: '  ' })), 'nome da conta');
      await erro('contas: nome repetido (sem diferenciar maiúsculas)', () => App.contas.criar(Object.assign({}, base, { nome: 'nubank conta' })), 'Já existe');
      await erro('contas: tipo inválido', () => App.contas.criar(Object.assign({}, base, { nome: 'X', tipo: 'xyz' })), 'tipo');
      await erro('contas: saldo inicial inválido', () => App.contas.criar(Object.assign({}, base, { nome: 'X', saldoInicial: null })), 'saldo inicial');
      await erro('contas: data inválida', () => App.contas.criar(Object.assign({}, base, { nome: 'X', dataAbertura: '2026-02-30' })), 'data de abertura');
      igual('contas: conta recusada não é cadastrada', App.contas.listar().length, 1);
      await App.contas.criar(Object.assign({}, base, { nome: 'Carteira', instituicao: 'Dinheiro', tipo: 'dinheiro', saldoInicial: 0 }));
      const contaA = App.contas.listar().find(c => c.nome === 'Nubank Conta');
      const contaB = App.contas.listar().find(c => c.nome === 'Carteira');
      await App.contas.editar(contaA.id, Object.assign({}, base, { nome: 'Nubank Principal' }));
      igual('contas: editar muda o nome', App.contas.obter(contaA.id).nome, 'Nubank Principal');
      await App.contas.editar(contaA.id, Object.assign({}, base, { nome: 'Nubank Principal' }));
      igual('contas: editar mantendo o próprio nome não dá conflito', App.contas.obter(contaA.id).nome, 'Nubank Principal');
      igual('contas: lista em ordem alfabética', App.contas.listar().map(c => c.nome), ['Carteira', 'Nubank Principal']);

      // ---------- Transferências (RF-03) ----------
      const transf = { contaId: contaA.id, contaDestinoId: contaB.id, valor: 40000, data: '2026-11-10', observacao: 'Para gastos do mês' };
      await App.lancamentos.criarTransferencia(transf);
      const t1 = App.lancamentos.listarTransferencias('2026-11')[0];
      igual('transferência: registro correto', [t1.tipo, t1.situacao, t1.categoriaId, t1.dataPagamento, t1.valor], ['transferencia', 'pago', null, '2026-11-10', 40000]);
      igual('transferência: saldos das duas contas', (function () {
        const s = App.contas.saldos();
        return [s[contaA.id], s[contaB.id]];
      })(), [210000, 40000]);
      await erro('transferência: mesma conta', () => App.lancamentos.criarTransferencia(Object.assign({}, transf, { contaDestinoId: contaA.id })), 'diferentes');
      await erro('transferência: valor zero', () => App.lancamentos.criarTransferencia(Object.assign({}, transf, { valor: 0 })), 'maior que zero');
      await erro('transferência: valor negativo', () => App.lancamentos.criarTransferencia(Object.assign({}, transf, { valor: -100 })), 'maior que zero');
      await erro('transferência: data inválida', () => App.lancamentos.criarTransferencia(Object.assign({}, transf, { data: '' })), 'data');
      await erro('transferência: conta inexistente', () => App.lancamentos.criarTransferencia(Object.assign({}, transf, { contaDestinoId: 'acc_nada' })), 'destino');
      igual('transferência: recusadas não foram gravadas', D_registros('lancamentos').length, 1);
      igual('transferência: filtro por mês', App.lancamentos.listarTransferencias('2026-10').length, 0);
      await App.lancamentos.editarTransferencia(t1.id, Object.assign({}, transf, { valor: 10000, data: '2026-11-12' }));
      igual('transferência: editar muda valor e data', (function () {
        const t = App.lancamentos.obter(t1.id);
        return [t.valor, t.dataPagamento, t.dataCompetencia];
      })(), [10000, '2026-11-12', '2026-11-12']);

      // Conta inativa (RF-04): não recebe novas transferências, mas a antiga continua editável.
      await App.contas.definirAtiva(contaB.id, false);
      await erro('transferência: conta inativa não é aceita em nova transferência', () => App.lancamentos.criarTransferencia(transf), 'inativa');
      await App.lancamentos.editarTransferencia(t1.id, Object.assign({}, transf, { valor: 12000 }));
      igual('transferência: editar mantém conta que foi inativada depois', App.lancamentos.obter(t1.id).valor, 12000);
      await erro('contas: não exclui conta com lançamentos (RF-04)', () => App.contas.excluir(contaB.id), 'Inative');
      await App.lancamentos.excluirTransferencia(t1.id);
      igual('transferência: excluir devolve os saldos', App.contas.saldos()[contaA.id], 250000);
      await App.contas.excluir(contaB.id);
      igual('contas: exclui conta sem lançamentos', App.contas.listar().map(c => c.nome), ['Nubank Principal']);

      // ---------- Categorias (RF-05 a RF-07) ----------
      const cat = { nome: 'Moradia', natureza: 'despesa', cor: '#1D4ED8' };
      await App.categorias.criar(cat);
      igual('categorias: criar normaliza a cor para minúsculas', App.categorias.listar('despesa')[0].cor, '#1d4ed8');
      await erro('categorias: nome repetido no mesmo tipo', () => App.categorias.criar(Object.assign({}, cat, { nome: 'moradia' })), 'Já existe');
      await App.categorias.criar(Object.assign({}, cat, { natureza: 'receita' }));
      igual('categorias: mesmo nome pode existir em receita e despesa', App.categorias.listar().length, 2);
      await erro('categorias: cor inválida', () => App.categorias.criar(Object.assign({}, cat, { nome: 'Y', cor: 'azul' })), 'cor');
      await erro('categorias: tipo inválido', () => App.categorias.criar(Object.assign({}, cat, { nome: 'Y', natureza: 'x' })), 'receita ou de despesa');
      const moradia = App.categorias.listar('despesa')[0];
      await App.categorias.criar(Object.assign({}, cat, { nome: 'Lazer' }));
      const lazer = App.categorias.listar('despesa').find(c => c.nome === 'Lazer');
      const receitaMoradia = App.categorias.listar('receita')[0];

      D_registros('lancamentos').push({ id: 'lan_1', tipo: 'despesa', categoriaId: moradia.id, contaId: contaA.id, valor: 100, situacao: 'pago' });
      D_registros('recorrencias').push({ id: 'rec_1', modelo: { categoriaId: moradia.id, contaId: contaA.id } });
      D_registros('compras_cartao').push({ id: 'cmp_1', categoriaId: moradia.id });
      igual('categorias: uso conta lançamentos, recorrências e compras', App.categorias.usoDaCategoria(moradia.id), { lancamentos: 1, recorrencias: 1, compras: 1, total: 3 });
      await erro('categorias: não exclui categoria em uso (RF-06)', () => App.categorias.excluir(moradia.id), 'Troque-a');
      await erro('categorias: não muda tipo de categoria em uso', () => App.categorias.editar(moradia.id, Object.assign({}, cat, { natureza: 'receita' })), 'em uso');
      await erro('categorias: troca exige mesmo tipo', () => App.categorias.trocarEExcluir(moradia.id, receitaMoradia.id), 'mesmo tipo');
      await erro('categorias: troca exige destino diferente', () => App.categorias.trocarEExcluir(moradia.id, moradia.id), 'diferente');
      igual('categorias: recusas não apagaram nada', App.categorias.listar().length, 3);
      gravacoes = [];
      await App.categorias.trocarEExcluir(moradia.id, lazer.id);
      igual('categorias: troca move lançamento, recorrência e compra', [
        D_registros('lancamentos')[0].categoriaId, D_registros('recorrencias')[0].modelo.categoriaId, D_registros('compras_cartao')[0].categoriaId,
      ], [lazer.id, lazer.id, lazer.id]);
      igual('categorias: troca exclui a categoria antiga', App.categorias.obter(moradia.id), undefined);
      igual('categorias: troca grava todos os arquivos afetados', gravacoes.slice().sort(), ['categorias', 'compras_cartao', 'lancamentos', 'recorrencias']);
      await App.categorias.excluir(receitaMoradia.id);
      igual('categorias: exclui categoria sem uso', App.categorias.listar().map(c => c.nome), ['Lazer']);

      // ---------- Entradas e saídas (RF-08 a RF-12) ----------
      ['lancamentos', 'recorrencias', 'compras_cartao'].forEach(n => { D_registros(n).length = 0; }); // limpa o que os testes anteriores deixaram
      await App.categorias.criar({ nome: 'Salário', natureza: 'receita', cor: '#15803d' });
      const catRec = App.categorias.listar('receita')[0];
      const catDesp = App.categorias.listar('despesa')[0];
      const sai = { descricao: 'Conta de luz', valor: 18750, categoriaId: catDesp.id, contaId: contaA.id, dataCompetencia: '2026-11-01', dataVencimento: '2026-11-10', situacao: 'pendente', dataPagamento: '', observacao: '' };
      await App.lancamentos.criarMovimento('despesa', sai);
      const luz = App.lancamentos.listarMovimentos('despesa')[0];
      igual('saída: nasce pendente, sem data de pagamento e sem recorrência', [luz.tipo, luz.situacao, luz.dataPagamento, luz.recorrenciaId, luz.origem], ['despesa', 'pendente', null, null, null]);
      igual('saída: pendente não altera o saldo', App.contas.saldos()[contaA.id], 250000);
      await erro('saída: descrição em branco', () => App.lancamentos.criarMovimento('despesa', { ...sai, descricao: ' ' }), 'descrição');
      await erro('saída: valor zero', () => App.lancamentos.criarMovimento('despesa', { ...sai, valor: 0 }), 'maior que zero');
      await erro('saída: valor não inteiro', () => App.lancamentos.criarMovimento('despesa', { ...sai, valor: 10.5 }), 'maior que zero');
      await erro('saída: sem categoria', () => App.lancamentos.criarMovimento('despesa', { ...sai, categoriaId: '' }), 'categoria');
      await erro('saída: categoria de receita não vale', () => App.lancamentos.criarMovimento('despesa', { ...sai, categoriaId: catRec.id }), 'não é de despesa');
      await erro('entrada: categoria de despesa não vale', () => App.lancamentos.criarMovimento('receita', { ...sai, categoriaId: catDesp.id }), 'não é de receita');
      await erro('saída: conta inexistente', () => App.lancamentos.criarMovimento('despesa', { ...sai, contaId: 'acc_x' }), 'Escolha a conta');
      await erro('saída: pago exige data de pagamento (RF-09)', () => App.lancamentos.criarMovimento('despesa', { ...sai, situacao: 'pago' }), 'data em que');
      await erro('saída: "recebido" não vale para despesa', () => App.lancamentos.criarMovimento('despesa', { ...sai, situacao: 'recebido', dataPagamento: '2026-11-10' }), 'situação');
      await erro('saída: competência inválida', () => App.lancamentos.criarMovimento('despesa', { ...sai, dataCompetencia: '' }), 'competência');
      await erro('saída: vencimento inválido', () => App.lancamentos.criarMovimento('despesa', { ...sai, dataVencimento: '2026-02-30' }), 'vencimento');
      await erro('lançamento: tipo desconhecido', () => App.lancamentos.criarMovimento('aporte', sai), 'Tipo');
      igual('saída: recusadas não foram gravadas', App.lancamentos.listarMovimentos('despesa').length, 1);

      await App.lancamentos.efetivar(luz.id, '2026-11-10');
      igual('saída: marcar como paga define situação e data', [App.lancamentos.obter(luz.id).situacao, App.lancamentos.obter(luz.id).dataPagamento], ['pago', '2026-11-10']);
      igual('saída: paga reduz o saldo da conta', App.contas.saldos()[contaA.id], 231250);
      await erro('saída: efetivar exige data válida', () => App.lancamentos.efetivar(luz.id, ''), 'data');
      await App.lancamentos.desfazerEfetivacao(luz.id);
      igual('saída: desfazer volta para pendente e apaga a data', [App.lancamentos.obter(luz.id).situacao, App.lancamentos.obter(luz.id).dataPagamento], ['pendente', null]);
      igual('saída: saldo volta ao anterior', App.contas.saldos()[contaA.id], 250000);

      // ---------- Planilha .xlsx (RF-41): estrutura do arquivo ----------
      {
        // Leitor mínimo de ZIP, só para conferir o que o gerador escreveu (inclusive os CRC).
        const lerZip = async (bytes) => {
          const v = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
          const fim = bytes.length - 22;
          if (v.getUint32(fim, true) !== 0x06054b50) throw new Error('fim do ZIP não encontrado');
          const total = v.getUint16(fim + 10, true);
          let pos = v.getUint32(fim + 16, true);
          const saida = {};
          for (let i = 0; i < total; i++) {
            if (v.getUint32(pos, true) !== 0x02014b50) throw new Error('entrada central inválida');
            const crc = v.getUint32(pos + 16, true), tamComprimido = v.getUint32(pos + 20, true), tamOriginal = v.getUint32(pos + 24, true), metodo = v.getUint16(pos + 10, true);
            const nomeLen = v.getUint16(pos + 28, true), extraLen = v.getUint16(pos + 30, true), comLen = v.getUint16(pos + 32, true);
            const local = v.getUint32(pos + 42, true);
            const nome = new TextDecoder().decode(bytes.slice(pos + 46, pos + 46 + nomeLen));
            const inicio = local + 30 + v.getUint16(local + 26, true) + v.getUint16(local + 28, true);
            let dados = bytes.slice(inicio, inicio + tamComprimido);
            if (metodo === 8) dados = new Uint8Array(await new Response(new Blob([dados]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
            saida[nome] = { texto: new TextDecoder().decode(dados), crcOk: App.xlsx.crc32(dados) === crc, metodo, tamanhoOk: dados.length === tamOriginal, tamanhoNoZip: tamComprimido };
            pos += 46 + nomeLen + extraLen + comLen;
          }
          return saida;
        };
        const planilhas = [
          { nome: 'Teste: a/b?', colunas: [{ titulo: 'Nome' }, { titulo: 'Valor', tipo: 'moeda' }, { titulo: 'Data', tipo: 'data' }, { titulo: 'Pct', tipo: 'percentual' }, { titulo: 'N', tipo: 'numero' }],
            linhas: [['Ana & <Cia> "x"', 123456, '2026-11-10', 0.0532, 3], ['Sem valores', null, null, null, null], ['Ctrl\u0001 ok', -50, 'texto', 0, 0]] },
          { nome: 'Teste: a/b?', colunas: [{ titulo: 'X' }], linhas: [] },

        igual('xlsx: CRC-32 conhecido', App.xlsx.crc32(new TextEncoder().encode('123456789')), 0xcbf43926);

        // Compressão (DEFLATE) do .xlsx
        const grande = { nome: 'Grande', colunas: [{ titulo: 'Descrição' }, { titulo: 'Valor', tipo: 'moeda' }, { titulo: 'Data', tipo: 'data' }],

        const comprimido = await App.xlsx.criar([grande]);

        igual('xlsx comprimido: o arquivo fica bem menor que o armazenado', [comprimido.length < armazenado.length / 3, comprimido.length < armazenado.length], [true, true]);
        igual('xlsx comprimido: planilha usa DEFLATE (método 8) e o armazenado usa método 0', [zc['xl/worksheets/sheet1.xml'].metodo, za['xl/worksheets/sheet1.xml'].metodo], [8, 0]);
        igual('xlsx comprimido: depois de descomprimir, CRC e tamanho originais conferem em todos os arquivos', [Object.values(zc).every(a => a.crcOk && a.tamanhoOk), Object.values(za).every(a => a.crcOk && a.tamanhoOk)], [true, true]);
        igual('xlsx comprimido: o conteúdo é idêntico ao do arquivo sem compressão', Object.keys(zc).every(n => zc[n].texto === za[n].texto), true);

      // ---------- Backup e restauração (RF-39, RF-40), com uma pasta falsa em memória ----------

        const BA = App.backup;
        class ArquivoFalso {
          constructor(n) { this.kind = 'file'; this.name = n; this.texto = ''; }
          async getFile() { const t = this.texto; return { text: async () => t }; }
          async createWritable() { const self = this; let buf = ''; return { write: async (t) => { buf += t; }, close: async () => { self.texto = buf; }, abort: async () => {} }; }
        }
        class PastaFalsa {
          constructor(n) { this.kind = 'directory'; this.name = n; this.itens = new Map(); }
          async getDirectoryHandle(n, o) { let d = this.itens.get(n); if (!d || d.kind !== 'directory') { if (!(o && o.create)) { const e = new Error('não existe'); e.name = 'NotFoundError'; throw e; } d = new PastaFalsa(n); this.itens.set(n, d); } return d; }
          async getFileHandle(n, o) { let f = this.itens.get(n); if (!f || f.kind !== 'file') { if (!(o && o.create)) { const e = new Error('não existe'); e.name = 'NotFoundError'; throw e; } f = new ArquivoFalso(n); this.itens.set(n, f); } return f; }
          async *entries() { for (const par of Array.from(this.itens.entries())) yield par; }
          async removeEntry(n) { this.itens.delete(n); }
        }
        const raiz = new PastaFalsa('Dados');
        const nomesDados = ['config', 'contas', 'categorias', 'lancamentos', 'recorrencias', 'cartoes', 'compras_cartao', 'faturas', 'investimentos'];

        App.storage.substituirDados = async (c) => { substituicoes++; Object.keys(c).forEach(n => { memoria[n] = c[n]; }); return { falhas: [] }; };
        const clone = (o) => JSON.parse(JSON.stringify(o));
        const estadoAtual = () => { const e = {}; nomesDados.forEach(n => { e[n] = clone(memoria[n]); }); return e; };
        const pastaBackups = async () => raiz.getDirectoryHandle('backups');

        // Nomes e retenção
        igual('backup: nome da cópia com minutos', BA.nomeDaCopia(new Date(2026, 10, 10, 14, 32)), '2026-11-10_14-32');
        igual('backup: nome com zeros à esquerda e sufixo', BA.nomeDaCopia(new Date(2026, 0, 5, 7, 3), 'antes-de-restaurar'), '2026-01-05_07-03_antes-de-restaurar');
        igual('backup: interpretar nome automático', BA.interpretarNome('2026-11-10_14-32'), { nome: '2026-11-10_14-32', data: '2026-11-10', hora: '14:32', sufixo: '', automatico: true });
        igual('backup: interpretar nome com sufixo', (({ sufixo, automatico }) => [sufixo, automatico])(BA.interpretarNome('2026-11-10_14-32_antes-de-restaurar')), ['antes-de-restaurar', false]);
        igual('backup: nome fora do padrão é ignorado', [BA.interpretarNome('qualquer'), BA.interpretarNome('2026-11-10')], [null, null]);
        const nomesRet = ['2026-11-10_10-00', '2026-11-10_10-05', '2026-11-10_10-10', '2026-11-09_09-00', '2026-11-09_18-00', '2026-10-01_08-00', '2026-08-01_08-00', '2026-11-10_12-00_antes-de-restaurar'];
        igual('retenção: mantém as N mais recentes e a última de cada dia recente; nunca apaga cópia com sufixo', BA.selecionarParaApagar(nomesRet, '2026-11-10', 2, 30), ['2026-11-10_10-00', '2026-11-09_09-00', '2026-10-01_08-00', '2026-08-01_08-00']);
        igual('retenção: com limite folgado nada é apagado', BA.selecionarParaApagar(nomesRet, '2026-11-10', 30, 30), []);
        igual('retenção: lista vazia', BA.selecionarParaApagar([], '2026-11-10', 5, 30), []);

        // Criar, listar e ler
        const nomeCopia = await BA.criarCopia();
        const nomeCopia2 = await BA.criarCopia();
        const pasta = await pastaBackups();
        const listaA = await BA.listar();
        igual('backup: a cópia vai para backups/ com os 9 arquivos', [[...(await pasta.getDirectoryHandle(nomeCopia)).itens.keys()].sort(), BA.ultimo().nome], [nomesDados.map(n => n + '.json').sort(), nomeCopia2]);
        igual('backup: cópias no mesmo minuto compartilham a pasta', (nomeCopia === nomeCopia2) === (listaA.length === 1), true);
        igual('backup: o conteúdo copiado é igual aos dados', await BA.lerCopia(nomeCopia), estadoAtual());
        igual('backup: o arquivo copiado é JSON formatado, igual ao dos dados', (await (await (await pasta.getDirectoryHandle(nomeCopia)).getFileHandle('contas.json')).getFile()).text ? true : false, true);
        const arqContas = await (await pasta.getDirectoryHandle(nomeCopia)).getFileHandle('contas.json');
        igual('backup: texto do arquivo termina em quebra de linha', arqContas.texto.endsWith('\n') && arqContas.texto.includes('\n  '), true);
        await erro('backup: cópia inexistente', () => BA.lerCopia('2000-01-01_00-00'), 'não foi encontrada');
        const pastaCopia = await pasta.getDirectoryHandle(nomeCopia);
        const guardado = pastaCopia.itens.get('faturas.json');
        pastaCopia.itens.delete('faturas.json');
        await erro('backup: cópia incompleta', () => BA.lerCopia(nomeCopia), 'incompleta');
        const danificado = new ArquivoFalso('faturas.json'); danificado.texto = '{ não é json';
        pastaCopia.itens.set('faturas.json', danificado);
        await erro('backup: arquivo danificado', () => BA.lerCopia(nomeCopia), 'danificado');
        const velho = new ArquivoFalso('faturas.json'); velho.texto = JSON.stringify({ versao: 99, registros: [] });
        pastaCopia.itens.set('faturas.json', velho);
        await erro('backup: versão mais nova do formato', () => BA.lerCopia(nomeCopia), 'versão mais nova');
        pastaCopia.itens.set('faturas.json', guardado);
        igual('backup: cópia íntegra volta a ser lida', (await BA.lerCopia(nomeCopia)).faturas.registros.length > 0, true);

        // Retenção na pasta (limite de cópias)
        for (let m = 0; m < 35; m++) await pasta.getDirectoryHandle('2000-01-01_10-' + String(m).padStart(2, '0'), { create: true });
        await pasta.getDirectoryHandle('2000-01-01_10-00_antes-de-restaurar', { create: true });
        const apagadas = await BA.aplicarRetencao();
        igual('retenção: com o padrão de 30 cópias, as mais antigas saem', [(await BA.listar()).filter(c => c.automatico).length, apagadas.length], [30, listaA.length + 35 - 30]);
        igual('retenção: a cópia com sufixo continua lá', (await BA.listar()).some(c => c.sufixo === 'antes-de-restaurar'), true);
        memoria.config.preferencias = { backupsMantidos: 5 };
        await BA.aplicarRetencao();
        igual('retenção: o limite é configurável', [BA.copiasMantidas(), (await BA.listar()).filter(c => c.automatico).length], [5, 5]);
        delete memoria.config.preferencias;
        igual('retenção: sem preferência o padrão é 30', BA.copiasMantidas(), 30);

        // Automático
        let concluidos = 0;
        App.eventos.on('backup:concluido', () => { concluidos++; });
        await BA.executarAutomatico();
        igual('automático: cria a cópia, aplica a retenção e avisa', [concluidos, (await BA.listar()).some(c => c.nome === BA.nomeDaCopia(new Date()))], [1, true]);

        // Redução de tráfego: intervalo mínimo, cópia idêntica não é gravada
        igual('backup: atraso sem cópia anterior é só o sossego de 5 s', BA.atrasoDoProximoBackup(1000000, 0, 600000), 5000);
        igual('backup: logo depois de uma cópia, espera o intervalo mínimo', BA.atrasoDoProximoBackup(1000000, 1000000 - 60000, 600000), 540000);
        igual('backup: passado o intervalo, volta ao sossego de 5 s', BA.atrasoDoProximoBackup(2000000, 1000000, 600000), 5000);
        igual('backup: intervalo padrão de 10 minutos e preferência configurável', [BA.intervaloMinutos(), (memoria.config.preferencias = { backupIntervaloMinutos: 30 }, BA.intervaloMinutos()), (memoria.config.preferencias = { backupIntervaloMinutos: 0 }, BA.intervaloMinutos()), (memoria.config.preferencias = { backupIntervaloMinutos: 999 }, BA.intervaloMinutos())], [10, 30, 10, 240]);
        delete memoria.config.preferencias;
        const nomeBase = await BA.criarCopia(undefined, true);
        const arqBase = await (await (await pasta.getDirectoryHandle(nomeBase)).getFileHandle('contas.json'));
        const tocado = { n: 0 };
        const escreverOriginalR = App.storage.escreverTexto;
        App.storage.escreverTexto = async (h, tx) => { tocado.n++; return escreverOriginalR(h, tx); };
        const nomeIgual = await BA.criarCopia();
        igual('backup: se nada mudou desde a última cópia, não grava nada de novo', [nomeIgual, tocado.n], [nomeBase, 0]);
        const nomeForcado = await BA.criarCopia(undefined, true);
        igual('backup: cópia pedida pelo usuário grava mesmo sem mudanças', [nomeForcado, tocado.n], [nomeBase, 9]);
        memoria.config.marca = 'mudou';
        tocado.n = 0;
        await BA.criarCopia();
        igual('backup: se algo mudou, grava de novo', tocado.n, 9);
        delete memoria.config.marca;
        App.storage.escreverTexto = escreverOriginalR;

        // Arquivo único (backup manual)
        const unico = BA.arquivoUnico();
        igual('manual: nome do arquivo único', /^MeuFinanceiro-backup-\d{4}-\d{2}-\d{2}_\d{2}-\d{2}\.json$/.test(unico.nome), true);
        const lido = BA.lerArquivoUnico(unico.texto);
        igual('manual: ida e volta preserva todos os dados', [lido.conjunto, lido.aplicacao], [estadoAtual(), App.versao]);
        igual('manual: resumo mostra quantos registros há em cada arquivo', (({ contas, lancamentos, compras_cartao, config }) => [contas, lancamentos, compras_cartao, config])(BA.resumo(lido.conjunto)), [D_registros('contas').length, D_registros('lancamentos').length, 2, undefined]);
        await erro('manual: arquivo que não é JSON', () => Promise.resolve().then(() => BA.lerArquivoUnico('abc')), 'não foi possível ler');
        await erro('manual: JSON de outro programa', () => Promise.resolve().then(() => BA.lerArquivoUnico('{"a":1}')), 'não é um backup');
        await erro('manual: arquivo de versão futura', () => Promise.resolve().then(() => BA.lerArquivoUnico(JSON.stringify({ ...JSON.parse(unico.texto), versaoDoArquivo: 99 }))), 'mais nova');
        const semContas = JSON.parse(unico.texto); delete semContas.arquivos.contas;
        await erro('manual: backup incompleto', () => Promise.resolve().then(() => BA.lerArquivoUnico(JSON.stringify(semContas))), 'incompleto');
        const registrosErrados = JSON.parse(unico.texto); registrosErrados.arquivos.lancamentos.registros = 'x';
        await erro('manual: arquivo sem lista de registros', () => Promise.resolve().then(() => BA.lerArquivoUnico(JSON.stringify(registrosErrados))), 'lista de registros');
        const estrutura = JSON.parse(unico.texto); estrutura.arquivos.contas = [];
        await erro('manual: arquivo com formato inesperado', () => Promise.resolve().then(() => BA.lerArquivoUnico(JSON.stringify(estrutura))), 'formato esperado');
        const futuro = JSON.parse(unico.texto); futuro.arquivos.contas.versao = 99;
        await erro('manual: arquivo de dados de versão futura', () => Promise.resolve().then(() => BA.lerArquivoUnico(JSON.stringify(futuro))), 'versão mais nova');

        // Restauração (RF-40)
        const instantaneo = estadoAtual();
        await App.contas.criar({ ...base, nome: 'Conta nova depois do backup' });
        igual('restaurar: antes, o estado atual tem a conta nova', D_registros('contas').some(c => c.nome === 'Conta nova depois do backup'), true);
        const estadoComConta = estadoAtual();
        const antesPastas = (await BA.listar()).length;
        const res = await BA.restaurar(clone(instantaneo));
        igual('restaurar: troca os dados pelos do backup', [memoria.contas.registros.some(c => c.nome === 'Conta nova depois do backup'), substituicoes, res.falhas], [false, 1, []]);
        igual('restaurar: guarda antes uma cópia de segurança do estado atual', [(await BA.listar()).some(c => c.nome === res.copiaDeSeguranca && c.sufixo === 'antes-de-restaurar'), await BA.lerCopia(res.copiaDeSeguranca)], [true, estadoComConta]);
        igual('restaurar: o estado restaurado é igual ao backup', estadoAtual(), instantaneo);
        const invalido = clone(instantaneo); delete invalido.cartoes;
        const pastasAntes = (await BA.listar()).length;
        await erro('restaurar: backup inválido é recusado antes de qualquer alteração', () => BA.restaurar(invalido), 'incompleto');
        igual('restaurar: recusado não cria cópia nem troca dados', [(await BA.listar()).length, substituicoes], [pastasAntes, 1]);
        const escreverOriginal = App.storage.escreverTexto;
        App.storage.escreverTexto = async () => { throw new Error('disco cheio'); };
        await erro('restaurar: sem conseguir guardar a cópia de segurança, cancela tudo', () => BA.restaurar(clone(instantaneo)), 'cópia de segurança');
        App.storage.escreverTexto = escreverOriginal;
        igual('restaurar: cancelado não trocou os dados', substituicoes, 1);
        const doDisco = await BA.lerCopia(nomeCopia);
        const aposDisco = await BA.restaurar(doDisco);
        igual('restaurar: também funciona a partir de uma cópia da pasta backups', [aposDisco.falhas, substituicoes], [[], 2]);
        // Revisão: duas restaurações no mesmo minuto não podem sobrescrever a cópia de segurança da primeira.
        const res3 = await BA.restaurar(clone(instantaneo));
        const segurancas = (await BA.listar()).filter(c => c.sufixo.indexOf('antes-de-restaurar') === 0).map(c => c.nome);
        igual('restaurar: cada restauração guarda a sua própria cópia de segurança, mesmo no mesmo minuto', [new Set([res.copiaDeSeguranca, aposDisco.copiaDeSeguranca, res3.copiaDeSeguranca]).size, [res.copiaDeSeguranca, aposDisco.copiaDeSeguranca, res3.copiaDeSeguranca].every(n => segurancas.includes(n))], [3, true]);
        igual('restaurar: a primeira cópia de segurança continua com o estado original (não foi sobrescrita)', await BA.lerCopia(res.copiaDeSeguranca), estadoComConta);
      }

      // ---------- Correções da revisão final ----------
      {
        // Valor atual do investimento considera aportes e resgates feitos depois da última atualização
        const CI = App.calc.investimentos;
        const invR = (movs, atual) => ({ classe: 'renda_fixa', movimentacoes: movs, atualizacoes: atual });
        const aporteCedo = { tipo: 'aporte', data: '2026-06-01', valor: 510000 };
        const r1 = CI.resumoDoInvestimento(invR([aporteCedo, { tipo: 'aporte', data: '2026-11-05', valor: 10000 }], [{ data: '2026-10-31', valorAtual: 523400 }]));
        igual('investimento: aporte depois da última atualização entra no valor atual (o patrimônio não cai)', [r1.valorAtual, r1.aportado, r1.rentabilidade, r1.valorAtualAjustado], [533400, 520000, 13400, true]);
        const r2 = CI.resumoDoInvestimento(invR([{ tipo: 'aporte', data: '2026-06-01', valor: 500000 }, { tipo: 'resgate', data: '2026-11-05', valor: 523400 }], [{ data: '2026-10-31', valorAtual: 523400 }]));
        igual('investimento: resgate total depois da última atualização zera o valor (o patrimônio não dobra)', [r2.valorAtual, r2.rentabilidade], [0, 23400]);
        const r3 = CI.resumoDoInvestimento(invR([{ tipo: 'aporte', data: '2026-06-01', valor: 100000 }, { tipo: 'aporte', data: '2026-10-31', valor: 5000 }], [{ data: '2026-10-31', valorAtual: 108000 }]));
        igual('investimento: movimento na mesma data da atualização já está no valor informado', [r3.valorAtual, r3.valorAtualAjustado], [108000, false]);
        igual('investimento: com data de corte, movimentos posteriores ao corte não contam', CI.resumoDoInvestimento(invR([aporteCedo, { tipo: 'aporte', data: '2026-11-05', valor: 10000 }], [{ data: '2026-10-31', valorAtual: 523400 }]), '2026-11-01').valorAtual, 523400);
        igual('investimento: resgate maior que o valor nunca deixa o valor negativo', CI.resumoDoInvestimento(invR([{ tipo: 'aporte', data: '2026-06-01', valor: 1000 }, { tipo: 'resgate', data: '2026-11-05', valor: 5000 }], [{ data: '2026-10-31', valorAtual: 1000 }])).valorAtual, 0);
        igual('investimento: rendimento e taxa depois da atualização não mudam o valor do ativo', CI.resumoDoInvestimento(invR([aporteCedo, { tipo: 'rendimento', data: '2026-11-05', valor: 3000 }, { tipo: 'taxa', data: '2026-11-06', valor: 100 }], [{ data: '2026-10-31', valorAtual: 523400 }])).valorAtual, 523400);

        zerarDados();
        const HR = '2026-11-10';
        await App.contas.criar({ ...base, nome: 'Conta R', saldoInicial: 80000 });
        const contaR = App.contas.listar()[0];
        await App.categorias.criar({ nome: 'Compras R', natureza: 'despesa', cor: '#1d4ed8' });
        const catR = App.categorias.listar('despesa')[0];

        // Conta inativa continua no saldo e no patrimônio
        await App.contas.definirAtiva(contaR.id, false);
        const PR = App.calc.painel.preparar({ contas: D_registros('contas'), lancamentos: D_registros('lancamentos'), cartoes: [], compras: [], faturas: [], investimentos: [] });
        igual('conta inativa: o saldo total e o saldo no painel continuam incluindo o dinheiro dela', [App.calc.saldoTotal(D_registros('contas'), App.contas.saldos()), App.calc.painel.saldoEm(PR, HR), App.calc.painel.patrimonio(PR, HR).patrimonio], [80000, 80000, 80000]);
        await App.contas.definirAtiva(contaR.id, true);

        // Estorno parcial não pode ser removido depois do estorno total
        await App.cartoes.criar({ nome: 'Cartão R', instituicao: 'B', limite: 900000, diaFechamento: 3, diaVencimento: 10, compraNoDiaFechamento: 'proxima' });
        const cartaoR = App.cartoes.listar()[0];
        await App.faturas.gerarFaturas(HR);
        await App.compras.criar({ cartaoId: cartaoR.id, descricao: 'TV', valorTotal: 100000, parcelas: 1, dataCompra: HR, categoriaId: catR.id, observacao: '' }, HR);
        const tv = App.compras.listar()[0];
        await App.compras.estornarParcial(tv.id, { valor: 20000, mesCredito: '' }, HR);
        igual('estorno total: a prévia vem do motor (parcelas canceladas, valor e crédito)', App.compras.previaDoEstornoTotal(tv, HR), { parcelasCanceladas: 1, valorCancelado: 100000, credito: -20000 });
        await App.compras.estornarTotal(tv.id, { mesCredito: '' }, HR);
        const fatTv = App.faturas.obterPorMes(cartaoR.id, App.calc.cartoes.mesDaFatura(cartaoR, HR));
        const ajusteParcial = fatTv.ajustes.find(a => a.tipo === 'estorno_parcial');
        await erro('estorno: não remove o crédito de um estorno parcial depois do estorno total', () => App.faturas.removerAjuste(fatTv.id, ajusteParcial.id, HR), 'já está estornada');
        igual('estorno: o total da fatura continua fechando em zero (parcela cancelada, parcial e reversão se anulam)', App.faturas.info(fatTv, HR).total, 0);

        // Cartão com ajuste ou encargo lançado não é excluído em silêncio
        await App.cartoes.criar({ nome: 'Cartão S', instituicao: 'B', limite: 100000, diaFechamento: 5, diaVencimento: 12, compraNoDiaFechamento: 'proxima' });
        const cartaoS = App.cartoes.listar().find(c => c.nome === 'Cartão S');
        await App.faturas.gerarFaturas(HR);
        const fatS = App.faturas.obterPorMes(cartaoS.id, App.calc.cartoes.mesDaFatura(cartaoS, HR));
        await App.faturas.adicionarEncargo(fatS.id, { tipo: 'juros', valor: 1520, descricao: '' }, HR);
        await erro('cartão: com encargo lançado numa fatura não pode ser excluído', () => App.cartoes.excluir(cartaoS.id), 'ajustes ou encargos');
        igual('cartão: a recusa não apagou nada', [App.cartoes.obter(cartaoS.id) !== undefined, App.faturas.obter(fatS.id).encargos.length], [true, 1]);
        await App.faturas.removerEncargo(fatS.id, fatS.encargos[0].id, HR);
        await App.cartoes.excluir(cartaoS.id);
        igual('cartão: sem ajustes nem encargos pode ser excluído', App.cartoes.obter(cartaoS.id), undefined);
      }

      function D_registros(n) { return App.dados.registros(n); }

      const falhas = resultados.filter(r => !r.ok).length;
      document.getElementById('resumo').innerHTML = falhas
        ? '<span class="falha">' + falhas + ' de ' + resultados.length + ' testes falharam.</span>'
        : '<span class="ok">Todos os ' + resultados.length + ' testes passaram.</span>';
      document.querySelector('#resultados tbody').innerHTML = resultados.map(r =>
        '<tr><td>' + U.escaparHtml(r.nome) + '</td><td class="' + (r.ok ? 'ok' : 'falha') + '">' +
        (r.ok ? 'OK' : 'Falhou: <code>' + U.escaparHtml(r.detalhe) + '</code>') + '</td></tr>'
      ).join('');
    })();
  </script>
